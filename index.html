<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>EXPLORA · Experiencias</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#030504">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="EXPLORA">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<style>
:root{--gold:#e2bc24;--gold2:#ffe66b;--green:#12e77d;--greenDark:#02653b;--red:#e84d4d;--ink:#050706;--panel:#101411;--muted:#a9b1ab;--line:rgba(255,255,255,.12)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{background:#020302;color:#fff;font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;scroll-behavior:smooth}
body{margin:0;min-height:100dvh;background:radial-gradient(circle at 50% -20%,rgba(226,188,36,.13),transparent 35%),#020302;overflow-x:hidden}
button,input,select,textarea{font:inherit}
button{cursor:pointer}
.hidden{display:none!important}

/* Acceso existente: idioma + moneda */
.onboarding{position:fixed;z-index:5000;inset:0;display:grid;place-items:center;background:#000;padding:24px}
.loginShell{width:min(520px,100%);display:flex;flex-direction:column;align-items:center;text-align:center;gap:26px}
.loginLogo{width:min(220px,54vw);aspect-ratio:1;object-fit:contain;border-radius:28px;filter:drop-shadow(0 24px 55px rgba(226,188,36,.12))}
.loginTitle{font-size:clamp(24px,4vw,38px);font-weight:900;letter-spacing:-.045em}
.loginSub{margin-top:-16px;color:rgba(255,255,255,.66);font-size:14px;font-weight:700}
.loginOptions{width:min(430px,100%);display:grid;grid-template-columns:1fr 1fr;gap:12px}
.loginOptions.currency{grid-template-columns:1fr}
.loginChoice{min-height:58px;border:1px solid rgba(255,255,255,.12);border-radius:18px;padding:14px 18px;background:linear-gradient(90deg,var(--gold2),var(--gold));color:#211900;font-size:16px;font-weight:950;box-shadow:0 14px 35px rgba(0,0,0,.34)}
.loginChoice.secondary{background:rgba(255,255,255,.07);color:#fff}

/* Pantalla del pasajero: sólo marca, países y tarjetas */
.app{min-height:100dvh;padding:12px 16px calc(86px + env(safe-area-inset-bottom));max-width:1500px;margin:0 auto}
.brandHeader{height:74px;display:flex;align-items:center;justify-content:center;position:sticky;top:0;z-index:80;background:linear-gradient(180deg,rgba(2,3,2,.98) 0%,rgba(2,3,2,.91) 72%,rgba(2,3,2,0) 100%);margin:0 -16px 5px;padding:7px 16px 18px}
.brandLogo{width:220px;height:58px;object-fit:contain;border-radius:14px;user-select:none;-webkit-user-drag:none;filter:drop-shadow(0 8px 22px rgba(226,188,36,.12))}
.countrySection{margin:8px 0 28px;scroll-margin-top:74px}
.countryHeading{display:flex;align-items:center;gap:10px;margin:0 2px 12px;font-size:20px;line-height:1;font-weight:950;letter-spacing:-.035em}
.countryHeading:after{content:"";height:1px;flex:1;background:linear-gradient(90deg,rgba(226,188,36,.48),transparent)}
.countryFlag{font-size:24px}
.cardGrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
.experienceCard{position:relative;min-width:0;height:286px;display:grid;grid-template-rows:minmax(0,1fr) 46px;overflow:hidden;border:1px solid rgba(255,255,255,.13);border-radius:22px;background:linear-gradient(180deg,#111512,#070907);box-shadow:0 16px 34px rgba(0,0,0,.34),inset 0 1px 0 rgba(255,255,255,.055);transition:transform .18s ease,border-color .18s ease,box-shadow .18s ease,background .18s ease}
.experienceCard:active{transform:scale(.992)}
.experienceCard.selected{border-color:rgba(18,231,125,.86);background:rgba(6,70,42,.34);box-shadow:0 0 0 3px rgba(18,231,125,.13),0 18px 42px rgba(0,0,0,.48),inset 0 0 34px rgba(18,231,125,.08)}
.experienceCard.locked{border-color:rgba(255,255,255,.08);filter:saturate(.4)}
.videoBox{position:relative;min-height:0;overflow:hidden;background:#000;isolation:isolate}
.videoBox video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;background:#000}
.videoShade{position:absolute;z-index:2;inset:0;background:linear-gradient(180deg,rgba(0,0,0,.08) 30%,rgba(0,0,0,.84) 100%);pointer-events:none}
.cardTitle{position:absolute;z-index:4;left:12px;right:12px;bottom:10px;font-size:clamp(14px,1.45vw,18px);line-height:1.05;font-weight:950;letter-spacing:-.025em;text-shadow:0 3px 15px rgba(0,0,0,.92);pointer-events:none}
.playButton{position:absolute;z-index:7;left:50%;top:50%;transform:translate(-50%,-50%);width:58px;height:58px;border-radius:50%;border:1px solid rgba(255,255,255,.45);display:grid;place-items:center;background:rgba(0,0,0,.58);color:#fff;box-shadow:0 10px 28px rgba(0,0,0,.54),0 0 0 5px rgba(255,255,255,.06);backdrop-filter:blur(7px);-webkit-backdrop-filter:blur(7px);font-size:23px;padding-left:4px}
.playButton.playing{padding-left:0;font-size:20px;background:rgba(0,0,0,.42)}
.selectedWash{position:absolute;z-index:3;inset:0;background:linear-gradient(180deg,rgba(18,231,125,.04),rgba(18,231,125,.28));opacity:0;pointer-events:none;transition:opacity .18s ease}
.selected .selectedWash{opacity:1}
.selectedBadge{position:absolute;z-index:8;left:10px;top:10px;display:none;align-items:center;gap:6px;padding:7px 10px;border-radius:999px;background:rgba(0,92,52,.86);border:1px solid rgba(132,255,193,.52);color:#d9ffeb;font-size:10px;font-weight:1000;letter-spacing:.08em;box-shadow:0 8px 20px rgba(0,0,0,.3)}
.selected .selectedBadge{display:inline-flex}
.freeBadge{position:absolute;z-index:12;right:10px;top:10px;padding:7px 9px;border-radius:999px;background:linear-gradient(90deg,#ffe982,#d5a80b);color:#241a00;font-size:9px;font-weight:1000;letter-spacing:.07em;box-shadow:0 8px 22px rgba(0,0,0,.35)}
.lockCover{position:absolute;z-index:10;inset:0;display:none;align-items:center;justify-content:center;text-align:center;padding:18px;background:rgba(1,3,2,.73);backdrop-filter:blur(2px);-webkit-backdrop-filter:blur(2px)}
.locked .lockCover{display:flex}.locked .cardTitle{z-index:12}
.lockMessage{max-width:210px;font-size:12px;line-height:1.32;font-weight:850;color:rgba(255,255,255,.88)}
.lockIcon{display:block;font-size:27px;margin-bottom:7px}
.cardAction{border:0;border-top:1px solid rgba(255,255,255,.09);background:linear-gradient(90deg,#f8dc61,#d5a80b);color:#201800;font-size:12px;font-weight:1000;letter-spacing:.075em;text-transform:uppercase;display:flex;align-items:center;justify-content:center;gap:7px;min-width:0}
.cardAction small{font-size:10px;letter-spacing:0;text-transform:none;opacity:.75;white-space:nowrap}
.cardAction.remove{background:rgba(5,55,34,.93);color:#baffd6;border-top-color:rgba(91,255,166,.28)}
.cardAction:disabled{cursor:not-allowed;background:#171b18;color:#777f79;border-top-color:rgba(255,255,255,.05)}

/* Resumen discreto; aparece sólo después de seleccionar */
.tripDock{position:fixed;z-index:100;left:50%;bottom:calc(12px + env(safe-area-inset-bottom));transform:translateX(-50%);width:min(720px,calc(100% - 24px));min-height:58px;border:1px solid rgba(91,255,166,.25);border-radius:21px;background:rgba(7,15,10,.94);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);box-shadow:0 18px 54px rgba(0,0,0,.62),inset 0 1px 0 rgba(255,255,255,.07);display:flex;align-items:center;gap:12px;padding:8px 9px 8px 16px}
.tripDockInfo{min-width:0;flex:1}
.tripDockCount{font-size:11px;color:rgba(255,255,255,.7);font-weight:800}
.tripDockTotal{font-size:20px;line-height:1.05;color:#63ffa8;font-weight:1000;letter-spacing:-.035em}
.tripDockButton{height:42px;border:0;border-radius:15px;padding:0 18px;background:linear-gradient(90deg,#f8dc61,#d5a80b);color:#211900;font-size:12px;font-weight:1000;letter-spacing:.06em}

/* Paneles secundarios */
.modal{position:fixed;z-index:6000;inset:0;display:none;align-items:flex-end;justify-content:center;padding:12px;background:rgba(0,0,0,.76);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px)}
.modal.open{display:flex}
.modalPanel{width:min(760px,100%);max-height:88dvh;overflow:auto;border:1px solid rgba(255,255,255,.14);border-radius:28px;background:linear-gradient(180deg,#131814,#050706);box-shadow:0 -25px 80px rgba(0,0,0,.74);padding:18px;padding-bottom:calc(18px + env(safe-area-inset-bottom))}
.modalTitle{margin:0 0 4px;text-align:center;font-size:24px;letter-spacing:-.04em}
.modalSub{text-align:center;color:var(--muted);font-size:12px;font-weight:700;margin-bottom:14px}
.tripItem{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 0;border-bottom:1px solid rgba(255,255,255,.08)}
.tripItemName{font-size:14px;font-weight:900}
.tripItemMeta{font-size:11px;color:rgba(255,255,255,.63);margin-top:4px}
.miniRemove{border:1px solid rgba(255,110,110,.35);border-radius:12px;background:rgba(104,18,18,.45);color:#ffd7d7;padding:8px 10px;font-size:10px;font-weight:950}
.sheetTotal{font-size:28px;text-align:center;color:#63ffa8;font-weight:1000;margin:18px 0 14px}
.sheetButtons{display:grid;grid-template-columns:1fr 1fr 1fr;gap:9px}
.actionBtn{min-height:47px;border:0;border-radius:16px;padding:11px 12px;font-size:12px;font-weight:950}
.actionBtn.gold{background:linear-gradient(90deg,#f8dc61,#d5a80b);color:#211900}
.actionBtn.green{background:linear-gradient(90deg,#17eb83,#08b866);color:#002a18}
.actionBtn.ghost{background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.1);color:#fff}
.actionBtn.red{background:rgba(112,20,20,.7);border:1px solid rgba(255,100,100,.25);color:#fff}
.field{width:100%;margin:6px 0;border:1px solid rgba(255,255,255,.14);border-radius:14px;background:rgba(0,0,0,.38);color:#fff;padding:13px;font-weight:800}
.adminTabs{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:12px 0}
.priceRow{display:grid;grid-template-columns:1.25fr .8fr .8fr;align-items:end;gap:8px;padding:9px 0;border-bottom:1px solid rgba(255,255,255,.07)}
.priceRow strong{font-size:12px;align-self:center}
.priceRow label{font-size:10px;color:rgba(255,255,255,.68);font-weight:800}
.priceRow input{width:100%;margin-top:4px;border:1px solid rgba(255,255,255,.12);border-radius:11px;background:#060806;color:#fff;padding:9px;font-weight:850}
.savedCard{border:1px solid rgba(255,255,255,.1);border-radius:17px;background:rgba(255,255,255,.045);padding:12px;margin:9px 0}
.savedCard textarea{width:100%;min-height:145px;margin:9px 0;border:1px solid rgba(255,255,255,.1);border-radius:12px;background:#050605;color:#fff;padding:10px;font-size:11px}
.empty{text-align:center;color:rgba(255,255,255,.58);padding:22px;font-size:13px}

@media(min-width:680px){
  .app{padding-left:22px;padding-right:22px}
  .brandHeader{margin-left:-22px;margin-right:-22px}
  .cardGrid{grid-template-columns:repeat(4,minmax(0,1fr));gap:15px}
  .experienceCard{height:294px}
}
@media(min-width:1180px){.experienceCard{height:310px}.cardGrid{gap:18px}.countrySection{margin-bottom:34px}}
@media(max-width:679px){.experienceCard{height:245px}.playButton{width:52px;height:52px}.sheetButtons{grid-template-columns:1fr}.priceRow{grid-template-columns:1fr}}
@media(orientation:landscape) and (max-height:720px) and (min-width:680px){.brandHeader{height:62px}.experienceCard{height:238px}.countrySection{margin-bottom:22px}.cardGrid{gap:12px}}
</style>
</head>
<body>
<div class="onboarding" id="onboarding">
  <div class="loginShell">
    <img class="loginLogo" src="icon-512.png" alt="EXPLORA Iguazú">
    <div id="loginContent"></div>
  </div>
</div>

<main class="app hidden" id="appRoot">
  <header class="brandHeader"><img id="brandLogo" class="brandLogo" src="assets/logo-explora-horizontal.webp" alt="EXPLORA Iguazú"></header>
  <div id="countries"></div>
</main>

<div class="tripDock hidden" id="tripDock">
  <div class="tripDockInfo"><div class="tripDockCount" id="tripCount"></div><div class="tripDockTotal" id="tripTotal"></div></div>
  <button class="tripDockButton" id="openTrip">VER</button>
</div>

<div class="modal" id="tripModal"><div class="modalPanel">
  <h2 class="modalTitle" id="tripTitle">Mi viaje EXPLORA</h2>
  <div class="modalSub" id="tripSubtitle"></div>
  <div id="tripList"></div>
  <div class="sheetTotal" id="sheetTotal"></div>
  <div class="sheetButtons">
    <button class="actionBtn green" id="openSave">Guardar presupuesto</button>
    <button class="actionBtn ghost" id="clearTrip">Limpiar viaje</button>
    <button class="actionBtn red" data-close="tripModal">Cerrar</button>
  </div>
</div></div>

<div class="modal" id="saveModal"><div class="modalPanel">
  <h2 class="modalTitle" id="saveTitle">Guardar presupuesto</h2>
  <div class="modalSub" id="saveSubtitle">Cargá los datos del pasajero.</div>
  <input class="field" id="passengerName" placeholder="Nombre del pasajero">
  <select class="field" id="countryCode"><option value="54">🇦🇷 Argentina +54</option><option value="55">🇧🇷 Brasil +55</option><option value="595">🇵🇾 Paraguay +595</option><option value="598">🇺🇾 Uruguay +598</option><option value="56">🇨🇱 Chile +56</option><option value="1">🇺🇸 Estados Unidos +1</option><option value="51">🇵🇪 Perú +51</option><option value="591">🇧🇴 Bolivia +591</option></select>
  <input class="field" id="phoneNumber" inputmode="tel" placeholder="WhatsApp del pasajero">
  <div class="sheetButtons" style="margin-top:10px">
    <button class="actionBtn green" id="saveBudget">Guardar presupuesto</button>
    <button class="actionBtn red" data-close="saveModal">Cerrar</button>
  </div>
</div></div>

<div class="modal" id="adminModal"><div class="modalPanel">
  <h2 class="modalTitle">Panel EXPLORA</h2>
  <div class="modalSub">Acceso privado mediante pulsación prolongada del logo.</div>
  <div class="adminTabs"><button class="actionBtn gold" id="showPrices">Precios</button><button class="actionBtn green" id="showBudgets">Presupuestos</button></div>
  <div id="pricesPanel"></div><div id="budgetsPanel" class="hidden"></div>
  <button class="actionBtn red" data-close="adminModal" style="width:100%;margin-top:12px">Cerrar</button>
</div></div>

const FORMATS={ars:new Intl.NumberFormat('es-AR',{style:'currency',currency:'ARS',maximumFractionDigits:0}),usd:new Intl.NumberFormat('en-US',{style:'currency',currency:'USD',maximumFractionDigits:0}),brl:new Intl.NumberFormat('pt-BR',{style:'currency',currency:'BRL',maximumFractionDigits:0})};
function t(key){return TEXT[lang][key]||TEXT.es[key]||key}
function nameOf(item){return lang==='en'&&EN_NAMES[item.id]?EN_NAMES[item.id]:item.nombre}
function formatMoney(value){value=Number(value||0);if(mode==='card')return FORMATS.ars.format(value*1.10).replace(',00','');if(mode==='usd')return FORMATS.usd.format(value/Number(fx.usd||1200));if(mode==='brl')return FORMATS.brl.format(value/Number(fx.brl||220));return FORMATS.ars.format(value).replace(',00','')}
function basePrice(item){const over=priceOverrides[item.id]||{};if(item.restaurant)return 0;if(item.comboEligible&&cart.cat_bra)return Number(over.comboRoundTrip||item.comboRoundTrip||20000);return Number(over.baseRoundTrip||item.baseRoundTrip||0)}
function kindOf(item){if(item.restaurant)return t('benefit');if(item.comboEligible&&cart.cat_bra)return t('extension');return item.oneWayOnly?t('one'):t('round')}
function total(){return Object.values(cart).reduce((sum,x)=>sum+Number(x.price||0),0)}
function hasBrazilExcursion(){return Object.values(cart).some(x=>x.pais==='Brasil'&&!x.restaurant)}
function repriceCart(){Object.keys(cart).forEach(id=>{const item=ITEMS.find(x=>x.id===id);if(item){cart[id].price=basePrice(item);cart[id].kind=kindOf(item)}})}
function stopOtherVideos(except){document.querySelectorAll('.videoBox video').forEach(video=>{if(video!==except&&!video.paused){video.pause();const btn=video.closest('.videoBox').querySelector('.playButton');if(btn){btn.textContent='▶';btn.classList.remove('playing')}}});if(playingVideo&&playingVideo!==except){playingVideo=null;playingButton=null}}
function toggleVideo(id){const item=ITEMS.find(x=>x.id===id);const card=document.querySelector(`[data-card="${id}"]`);if(!item||!card||card.classList.contains('locked'))return;const video=card.querySelector('video');const btn=card.querySelector('.playButton');if(video.paused){stopOtherVideos(video);video.muted=false;video.volume=1;video.play().then(()=>{btn.textContent='❚❚';btn.classList.add('playing');playingVideo=video;playingButton=btn}).catch(()=>{btn.textContent='▶';btn.classList.remove('playing')})}else{video.pause();btn.textContent='▶';btn.classList.remove('playing');playingVideo=null;playingButton=null}}
function cardHtml(item){const isRestaurant=!!item.restaurant;return `<article class="experienceCard" data-card="${item.id}">
 <div class="videoBox" data-video="${item.id}">
  <video playsinline webkit-playsinline preload="metadata" poster="${item.poster}" src="${item.videoSrc}" disablepictureinpicture controlslist="nodownload noplaybackrate nofullscreen"></video>
  <div class="videoShade"></div><div class="selectedWash"></div>
  <button class="playButton" type="button" data-play="${item.id}" aria-label="Play">▶</button>
  <div class="selectedBadge">✓ <span>${t('added')}</span></div>
  ${isRestaurant?`<div class="freeBadge">${t('free')}</div><div class="lockCover"><div class="lockMessage"><span class="lockIcon">🔒</span>${t('locked')}</div></div>`:''}
  <div class="cardTitle">${nameOf(item)}</div>
 </div>
 <button class="cardAction" type="button" data-toggle="${item.id}"></button>
 </article>`}
function renderGallery(){const host=$('countries');host.innerHTML=COUNTRIES.map(country=>{const flag=country==='Argentina'?'🇦🇷':country==='Brasil'?'🇧🇷':'🇵🇾';const label=lang==='en'?(country==='Argentina'?'Argentina':country==='Brasil'?'Brazil':'Paraguay'):country;return `<section class="countrySection" id="country-${country}"><h2 class="countryHeading"><span class="countryFlag">${flag}</span>${label}</h2><div class="cardGrid">${ITEMS.filter(x=>x.pais===country).map(cardHtml).join('')}</div></section>`}).join('');
 document.querySelectorAll('video').forEach(video=>{video.addEventListener('ended',()=>{const btn=video.closest('.videoBox').querySelector('.playButton');btn.textContent='▶';btn.classList.remove('playing');playingVideo=null;playingButton=null});video.addEventListener('pause',()=>{const btn=video.closest('.videoBox').querySelector('.playButton');if(btn){btn.textContent='▶';btn.classList.remove('playing')}});video.addEventListener('dblclick',e=>e.preventDefault())});
 updateCards();}
function updateCards(){const brazilUnlocked=hasBrazilExcursion();if(!brazilUnlocked){Object.keys(cart).forEach(id=>{const item=ITEMS.find(x=>x.id===id);if(item&&item.restaurant)delete cart[id]})}
 repriceCart();
 ITEMS.forEach(item=>{const card=document.querySelector(`[data-card="${item.id}"]`);if(!card)return;const selected=!!cart[item.id];const locked=item.restaurant&&!brazilUnlocked;card.classList.toggle('selected',selected);card.classList.toggle('locked',locked);const play=card.querySelector('.playButton');const action=card.querySelector('.cardAction');const video=card.querySelector('video');if(locked&&video&&!video.paused){video.pause();video.currentTime=0}play.disabled=locked;action.disabled=locked;action.classList.toggle('remove',selected);if(selected){action.innerHTML=`${t('remove')}`;}else if(item.restaurant){action.innerHTML=`${t('add')} <small>${t('free')}</small>`;}else{action.innerHTML=`${t('add')} <small>${formatMoney(basePrice(item))}</small>`;}});
 renderTrip();}
function toggleSelection(id){const item=ITEMS.find(x=>x.id===id);if(!item)return;if(item.restaurant&&!hasBrazilExcursion())return;if(cart[id])delete cart[id];else cart[id]={id:item.id,nombre:nameOf(item),pais:item.pais,bandera:item.bandera,restaurant:!!item.restaurant,duracion:item.duracion,price:basePrice(item),kind:kindOf(item)};updateCards()}

function openModal(id){$(id).classList.add('open')}

function budgetText(b){return `EXPLORA · ${lang==='en'?'BUDGET':'PRESUPUESTO'}\n${lang==='en'?'Passenger':'Pasajero'}: ${b.name}\nWhatsApp: +${b.code} ${b.phone}\n${lang==='en'?'Date':'Fecha'}: ${b.when}\n\n${b.items.map(x=>`• ${x.nombre} — ${x.kind} — ${formatMoney(x.price)}`).join('\n')}\n\n${t('total')}: ${formatMoney(b.total)}`}
function saveCurrentBudget(){const name=$('passengerName').value.trim();const phone=$('phoneNumber').value.replace(/\D/g,'');const code=$('countryCode').value;if(!name||!phone){alert(t('fill'));return}const b={id:Date.now(),name,phone,code,when:new Date().toLocaleString(lang==='en'?'en-US':'es-AR'),items:Object.values(cart).map(x=>({...x})),total:total(),mode,lang};savedBudgets.unshift(b);localStorage.setItem(LS_BUDGETS,JSON.stringify(savedBudgets));closeModal('saveModal');closeModal('tripModal');alert(t('saved'));renderAdminBudgets()}
function renderAdminPrices(){const panel=$('pricesPanel');panel.classList.remove('hidden');$('budgetsPanel').classList.add('hidden');panel.innerHTML=`<div class="priceRow"><strong>${t('usdRate')}</strong><label>ARS<input data-fx="usd" inputmode="numeric" value="${fx.usd||1200}"></label><span></span></div><div class="priceRow"><strong>${t('brlRate')}</strong><label>ARS<input data-fx="brl" inputmode="numeric" value="${fx.brl||220}"></label><span></span></div>`+ITEMS.filter(x=>!x.restaurant).map(item=>{const over=priceOverrides[item.id]||{};const base=over.baseRoundTrip||item.baseRoundTrip||0;const combo=over.comboRoundTrip||item.comboRoundTrip||20000;return `<div class="priceRow"><strong>${item.bandera} ${nameOf(item)}</strong><label>${item.oneWayOnly?t('one'):t('round')}<input data-price="${item.id}" data-field="baseRoundTrip" inputmode="numeric" value="${base}"></label>${item.comboEligible?`<label>${t('extension')}<input data-price="${item.id}" data-field="comboRoundTrip" inputmode="numeric" value="${combo}"></label>`:'<span></span>'}</div>`}).join('')+`<button class="actionBtn green" id="savePrices" style="width:100%;margin-top:12px">${t('savePrices')}</button>`;$('savePrices').onclick=()=>{document.querySelectorAll('[data-fx]').forEach(input=>{const value=Number(String(input.value).replace(/\D/g,''));if(value>0)fx[input.dataset.fx]=value});localStorage.setItem(LS_FX,JSON.stringify(fx));document.querySelectorAll('[data-price]').forEach(input=>{const value=Number(String(input.value).replace(/\D/g,''));if(!priceOverrides[input.dataset.price])priceOverrides[input.dataset.price]={};if(value>=0)priceOverrides[input.dataset.price][input.dataset.field]=value});localStorage.setItem(LS_PRICES,JSON.stringify(priceOverrides));updateCards();renderAdminPrices();alert(t('pricesSaved'))}}

document.addEventListener('click',e=>{const close=e.target.closest('[data-close]');if(close)closeModal(close.dataset.close)});
$('showPrices').onclick=renderAdminPrices;$('showBudgets').onclick=showBudgets;
$('budgetsPanel').onclick=async e=>{const copy=e.target.closest('[data-copy]');const del=e.target.closest('[data-delete-budget]');if(copy){const b=savedBudgets.find(x=>String(x.id)===String(copy.dataset.copy));try{await navigator.clipboard.writeText(budgetText(b));alert(t('copied'))}catch(err){alert(t('copyFail'))}}if(del){savedBudgets=savedBudgets.filter(x=>String(x.id)!==String(del.dataset.deleteBudget));localStorage.setItem(LS_BUDGETS,JSON.stringify(savedBudgets));renderAdminBudgets()}};
let holdTimer=null;const logo=$('brandLogo');const cancelHold=()=>{clearTimeout(holdTimer);holdTimer=null};logo.addEventListener('pointerdown',()=>{cancelHold();holdTimer=setTimeout(()=>{renderAdminPrices();renderAdminBudgets();openModal('adminModal')},1200)});['pointerup','pointercancel','pointerleave'].forEach(type=>logo.addEventListener(type,cancelHold));
document.addEventListener('visibilitychange',()=>{if(document.hidden)stopOtherVideos(null)});
renderLoginLanguage();
if('serviceWorker' in navigator){window.addEventListener('load',()=>{navigator.serviceWorker.register('./service-worker.js',{scope:'./'}).then(async reg=>{await navigator.serviceWorker.ready;if(reg.active)reg.active.postMessage({type:'CACHE_APP'});const doneKey='explora_media_offline_gallery_v1';if(localStorage.getItem(doneKey)==='ok')return;const cacheMedia=async()=>{for(const item of ITEMS){try{await fetch(item.videoSrc,{cache:'reload'})}catch(e){}await new Promise(r=>setTimeout(r,120))}localStorage.setItem(doneKey,'ok')};setTimeout(cacheMedia,5000)}).catch(e=>console.warn('PWA no disponible',e))})}
</script>
</body>
</html>
