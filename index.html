<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>EXPLORA · Experiencias</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<meta name="theme-color" content="#030504">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<style>
:root{
  --gold:#e7bf2d;--gold-light:#ffe477;--ink:#030504;--panel:#0b0f0d;--panel-2:#121814;
  --green:#19e47c;--green-dark:#087b48;--red:#dc3c42;--white:#fff;--muted:rgba(255,255,255,.72);
  --card-radius:22px;--gap:16px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{background:#030504;color-scheme:dark;scroll-behavior:smooth}
body{margin:0;min-height:100dvh;background:radial-gradient(circle at 50% -12%,rgba(231,191,45,.16),transparent 28%),linear-gradient(180deg,#080d0a,#020302 72%);color:#fff;font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;overscroll-behavior:none}
button,input,select,textarea{font:inherit}
button{touch-action:manipulation}
[hidden]{display:none!important}

/* Login */
.login-screen{position:fixed;z-index:500;inset:0;display:grid;place-items:center;padding:24px;background:radial-gradient(circle at 50% 24%,rgba(231,191,45,.20),transparent 31%),#020302}
.login-card{width:min(510px,100%);display:flex;flex-direction:column;align-items:center;text-align:center;gap:22px}
.login-logo{width:148px;height:148px;border-radius:34px;box-shadow:0 28px 70px rgba(0,0,0,.58),0 0 0 1px rgba(255,226,105,.22)}
.login-title{margin:0;font-size:clamp(27px,4vw,42px);line-height:1.04;letter-spacing:-.045em;font-weight:900}
.login-sub{margin:-10px 0 0;color:var(--muted);font-size:14px;font-weight:650}
.login-options{display:grid;grid-template-columns:1fr 1fr;gap:11px;width:100%}
.login-options.currency{grid-template-columns:1fr}
.login-option{min-height:60px;border:1px solid rgba(255,255,255,.13);border-radius:18px;padding:14px 18px;background:rgba(255,255,255,.07);color:#fff;font-weight:850;font-size:17px;box-shadow:0 14px 35px rgba(0,0,0,.25)}
.login-option.primary{background:linear-gradient(135deg,var(--gold-light),#c58e08);color:#231a00;border-color:transparent}

/* Main gallery */
.app-shell{height:100dvh;padding:calc(12px + env(safe-area-inset-top)) 18px calc(92px + env(safe-area-inset-bottom));display:grid;grid-template-rows:auto 1fr;gap:10px;overflow:hidden}
.brand-header{height:78px;display:flex;align-items:center;justify-content:center}
.brand-button{appearance:none;border:0;background:transparent;padding:0;border-radius:20px;cursor:default}
.brand-logo{display:block;width:78px;height:78px;border-radius:22px;box-shadow:0 18px 44px rgba(0,0,0,.46),0 0 0 1px rgba(231,191,45,.24)}
.gallery{width:min(1920px,100%);margin:0 auto;min-height:0;display:grid;grid-template-rows:repeat(3,minmax(0,1fr));gap:18px}
.country-section{min-height:0;display:grid;grid-template-rows:auto 1fr;gap:10px;margin:0;scroll-margin-top:0}
.country-heading{display:flex;align-items:center;gap:10px;margin:0;padding:0 4px}
.country-flag{font-size:22px;line-height:1}
.country-heading h2{margin:0;font-size:clamp(19px,1.55vw,28px);letter-spacing:-.03em;font-weight:900}
.cards-grid{min-height:0;display:flex;gap:12px;overflow-x:auto;overflow-y:hidden;padding:4px 4px 10px;scroll-snap-type:x proximity;scrollbar-width:none;-ms-overflow-style:none}
.cards-grid::-webkit-scrollbar{display:none}
.video-card{position:relative;flex:0 0 clamp(154px,14.4vw,212px);min-width:0;overflow:hidden;border:1px solid rgba(255,255,255,.14);border-radius:14px;background:linear-gradient(180deg,rgba(20,27,23,.98),rgba(7,10,8,.98));box-shadow:0 18px 45px rgba(0,0,0,.34);display:grid;grid-template-rows:minmax(0,1fr) 44px;transition:border-color .22s ease,box-shadow .22s ease,transform .22s ease;scroll-snap-align:start}
.video-card:active{transform:scale(.992)}
.media-stage{position:relative;min-height:0;aspect-ratio:2/3;overflow:hidden;background:#000;isolation:isolate}
.media-stage video,.media-stage .poster-fallback{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:center;background:#000}
.media-stage video{z-index:1}
.media-stage::before{content:"";position:absolute;z-index:2;inset:0;background:linear-gradient(180deg,rgba(0,0,0,.08),transparent 42%,rgba(0,0,0,.92));pointer-events:none}
.media-stage::after{content:"";position:absolute;z-index:3;inset:0;background:rgba(9,226,115,0);pointer-events:none;transition:background .22s ease}
.card-copy{position:absolute;z-index:5;left:12px;right:12px;bottom:12px;text-shadow:0 3px 18px rgba(0,0,0,.95);pointer-events:none}
.card-copy h3{margin:0;font-size:clamp(15px,1.1vw,22px);line-height:1.02;letter-spacing:-.03em;font-weight:900}
.card-copy p{display:none}
.play-button{position:absolute;z-index:8;left:50%;top:50%;transform:translate(-50%,-50%);width:58px;height:58px;border-radius:50%;border:1px solid rgba(255,255,255,.42);background:rgba(0,0,0,.58);backdrop-filter:blur(9px);-webkit-backdrop-filter:blur(9px);box-shadow:0 14px 34px rgba(0,0,0,.48),inset 0 1px 0 rgba(255,255,255,.22);display:grid;place-items:center;color:#fff;transition:opacity .18s ease,transform .18s ease,background .18s ease}
.play-button::before{content:"";display:block;margin-left:4px;border-top:10px solid transparent;border-bottom:10px solid transparent;border-left:16px solid currentColor}
.video-card.playing .play-button{opacity:0;transform:translate(-50%,-50%) scale(.82);pointer-events:none}
.media-stage:hover .play-button{background:rgba(0,0,0,.72)}
.select-button{appearance:none;border:0;border-top:1px solid rgba(255,255,255,.09);height:44px;min-height:44px;width:100%;padding:0 8px;background:linear-gradient(135deg,#f6d64f,#c18a06);color:#271d00;font-size:12px;font-weight:950;line-height:1;letter-spacing:.01em;cursor:pointer;display:flex;align-items:center;justify-content:center;text-align:center;white-space:nowrap;overflow:hidden}
.select-button:disabled{cursor:not-allowed;background:rgba(255,255,255,.07);color:rgba(255,255,255,.46)}
.free-badge,.selected-badge{position:absolute;z-index:10;top:9px;border-radius:999px;padding:6px 9px;font-size:10px;line-height:1;font-weight:950;letter-spacing:.07em;text-transform:uppercase;box-shadow:0 7px 20px rgba(0,0,0,.34)}
.free-badge{left:9px;background:linear-gradient(135deg,#ffed82,#c88f08);color:#261c00}
.selected-badge{right:9px;display:none;background:rgba(1,76,39,.90);border:1px solid rgba(60,255,155,.62);color:#baffd8}
.lock-layer{position:absolute;z-index:12;inset:0;display:none;align-items:center;justify-content:center;padding:18px;text-align:center;background:rgba(1,3,2,.70);backdrop-filter:blur(5px);-webkit-backdrop-filter:blur(5px)}
.lock-content{max-width:230px;display:flex;flex-direction:column;align-items:center;gap:9px;font-size:11px;line-height:1.3;font-weight:820;color:rgba(255,255,255,.92)}
.lock-icon{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;background:rgba(255,255,255,.09);border:1px solid rgba(255,255,255,.17);font-size:20px}
.video-card.locked .lock-layer{display:flex}
.video-card.locked video{filter:grayscale(1);opacity:.62}
.video-card.selected{border-color:rgba(35,247,137,.92);box-shadow:0 0 0 3px rgba(25,228,124,.14),0 20px 50px rgba(0,0,0,.40)}
.video-card.selected .media-stage::after{background:rgba(8,214,108,.22)}
.video-card.selected .selected-badge{display:block}
.video-card.selected .select-button{background:linear-gradient(135deg,#ed565b,#a8141c);color:#fff}

/* Dock shown only after a selection */
.selection-dock{position:fixed;z-index:80;left:50%;bottom:calc(14px + env(safe-area-inset-bottom));transform:translateX(-50%);width:min(620px,calc(100% - 24px));padding:7px;border:1px solid rgba(255,255,255,.13);border-radius:22px;background:rgba(6,10,8,.88);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);box-shadow:0 20px 60px rgba(0,0,0,.62)}
.selection-open{width:100%;min-height:54px;border:0;border-radius:16px;padding:10px 15px;background:linear-gradient(135deg,#0c2a1c,#0a1710);color:#fff;display:flex;align-items:center;justify-content:space-between;gap:12px;font-weight:800}
.selection-open strong{color:#4cff9f;font-size:20px;white-space:nowrap}

/* Modals */
.modal{position:fixed;z-index:300;inset:0;display:none;align-items:center;justify-content:center;padding:18px;background:rgba(0,0,0,.76);backdrop-filter:blur(9px);-webkit-backdrop-filter:blur(9px)}
.modal.open{display:flex}
.modal-panel{width:min(640px,100%);max-height:min(88dvh,900px);overflow:auto;border:1px solid rgba(255,255,255,.14);border-radius:26px;padding:19px;background:linear-gradient(180deg,#121914,#050706);box-shadow:0 30px 90px rgba(0,0,0,.72)}
.modal-head{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:12px}
.modal-head h2{margin:0;font-size:24px;letter-spacing:-.035em}
.icon-close{width:40px;height:40px;border-radius:50%;border:1px solid rgba(255,255,255,.13);background:rgba(255,255,255,.07);color:#fff;font-size:22px}
.choice-list{display:grid;gap:10px}
.choice-button{border:1px solid rgba(255,255,255,.12);border-radius:18px;min-height:64px;padding:12px 15px;background:rgba(255,255,255,.07);color:#fff;display:flex;align-items:center;justify-content:space-between;gap:12px;text-align:left;font-weight:850}
.choice-button strong{color:var(--gold-light);font-size:18px;white-space:nowrap}
.selection-list{display:grid;gap:9px;margin:10px 0}
.selection-item{display:grid;grid-template-columns:1fr auto;gap:12px;align-items:center;padding:12px;border:1px solid rgba(255,255,255,.10);border-radius:16px;background:rgba(255,255,255,.05)}
.selection-item small{display:block;margin-top:4px;color:var(--muted);font-weight:650}
.mini-remove{border:1px solid rgba(255,91,99,.34);border-radius:12px;padding:9px 11px;background:rgba(160,22,30,.45);color:#fff;font-weight:850}
.modal-total{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:13px 4px;font-size:18px;font-weight:850}
.modal-total strong{font-size:26px;color:#48ff9c}
.modal-actions{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-top:10px}
.action{min-height:50px;border:0;border-radius:15px;padding:11px 14px;font-weight:900}
.action.primary{background:linear-gradient(135deg,#29ed88,#08a85b);color:#022313}
.action.secondary{background:rgba(255,255,255,.09);color:#fff;border:1px solid rgba(255,255,255,.12)}
.action.danger{background:linear-gradient(135deg,#e44c52,#9f1119);color:#fff}
.field{display:block;width:100%;margin:9px 0;border:1px solid rgba(255,255,255,.14);border-radius:15px;background:rgba(0,0,0,.33);color:#fff;padding:13px;font-weight:750}
.hint{margin:0 0 12px;color:var(--muted);font-size:13px;line-height:1.4}
.toast{position:fixed;z-index:900;left:50%;bottom:calc(88px + env(safe-area-inset-bottom));transform:translate(-50%,18px);max-width:min(520px,calc(100% - 30px));padding:11px 15px;border:1px solid rgba(255,255,255,.15);border-radius:15px;background:rgba(10,14,12,.94);color:#fff;box-shadow:0 20px 55px rgba(0,0,0,.58);font-size:13px;font-weight:800;text-align:center;opacity:0;pointer-events:none;transition:.22s ease}
.toast.show{opacity:1;transform:translate(-50%,0)}

/* Hidden owner panel */
.admin-tabs{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:12px}
.admin-grid{display:grid;grid-template-columns:minmax(0,1.4fr) minmax(100px,.6fr);gap:8px;align-items:center;padding:9px 0;border-bottom:1px solid rgba(255,255,255,.08)}
.admin-grid input{width:100%;border:1px solid rgba(255,255,255,.13);border-radius:12px;background:rgba(0,0,0,.32);color:#fff;padding:10px;font-weight:750}
.saved-budget{padding:12px;margin:9px 0;border:1px solid rgba(255,255,255,.10);border-radius:15px;background:rgba(255,255,255,.05)}
.saved-budget small{display:block;color:var(--muted);margin-top:4px}

@media (min-width:1050px){.app-shell{padding-left:26px;padding-right:26px}.brand-header{height:84px}.brand-logo{width:84px;height:84px}.video-card{flex-basis:clamp(166px,14vw,220px)}}
@media (orientation:landscape) and (min-width:1050px){.gallery{gap:16px}.country-section{gap:8px}.video-card{flex-basis:clamp(160px,12vw,200px)}}
@media (max-width:760px){.app-shell{padding-left:10px;padding-right:10px;padding-bottom:calc(88px + env(safe-area-inset-bottom))}.brand-header{height:68px}.brand-logo{width:66px;height:66px;border-radius:18px}.gallery{gap:14px}.video-card{flex-basis:140px;border-radius:12px}.play-button{width:48px;height:48px}.play-button::before{border-top-width:8px;border-bottom-width:8px;border-left-width:13px}.card-copy{left:10px;right:10px;bottom:10px}.card-copy h3{font-size:14px}.select-button{font-size:11px;padding:0 6px}.modal-actions{grid-template-columns:1fr}.login-options{grid-template-columns:1fr}}
@media (prefers-reduced-motion:reduce){*{scroll-behavior:auto!important;transition:none!important}}
</style>
</head>
<body>
<section class="login-screen" id="loginScreen">
  <div class="login-card">
    <img src="icon-512.png" alt="EXPLORA Iguazú" class="login-logo">
    <div id="loginContent"></div>
  </div>
</section>

<div class="app-shell" id="appShell" hidden>
  <header class="brand-header">
    <button class="brand-button" id="brandButton" aria-label="EXPLORA"><img class="brand-logo" src="icon-512.png" alt="EXPLORA Iguazú"></button>
  </header>
  <main class="gallery" id="gallery"></main>
</div>

<div class="selection-dock" id="selectionDock" hidden>
  <button class="selection-open" id="openSelection"><span id="dockCount"></span><strong id="dockTotal"></strong></button>
</div>

<div class="modal" id="choiceModal" aria-hidden="true"><div class="modal-panel">
  <div class="modal-head"><h2 id="choiceTitle"></h2><button class="icon-close" data-close="choiceModal">×</button></div>
  <p class="hint" id="choiceHint"></p><div class="choice-list" id="choiceList"></div>
</div></div>

<div class="modal" id="selectionModal" aria-hidden="true"><div class="modal-panel">
  <div class="modal-head"><h2 id="selectionTitle">Mi selección</h2><button class="icon-close" data-close="selectionModal">×</button></div>
  <div class="selection-list" id="selectionList"></div>
  <div class="modal-total"><span id="totalLabel">Total</span><strong id="selectionTotal"></strong></div>
  <div class="modal-actions"><button class="action primary" id="openPassenger">Guardar presupuesto</button><button class="action danger" id="clearSelection">Limpiar</button></div>
</div></div>

<div class="modal" id="passengerModal" aria-hidden="true"><div class="modal-panel">
  <div class="modal-head"><h2 id="passengerTitle">Guardar presupuesto</h2><button class="icon-close" data-close="passengerModal">×</button></div>
  <p class="hint" id="passengerHint">Los datos quedan guardados solamente en esta tablet.</p>
  <input class="field" id="passengerName" placeholder="Nombre del pasajero" autocomplete="off">
  <select class="field" id="countryCode"><option value="54">🇦🇷 Argentina +54</option><option value="55">🇧🇷 Brasil +55</option><option value="595">🇵🇾 Paraguay +595</option><option value="598">🇺🇾 Uruguay +598</option><option value="56">🇨🇱 Chile +56</option><option value="1">🇺🇸 Estados Unidos +1</option><option value="51">🇵🇪 Perú +51</option><option value="591">🇧🇴 Bolivia +591</option></select>
  <input class="field" id="phoneNumber" inputmode="tel" placeholder="Número sin código de país" autocomplete="off">
  <div class="modal-actions"><button class="action primary" id="saveBudget">Guardar</button><button class="action secondary" data-close="passengerModal">Cancelar</button></div>
</div></div>

<div class="modal" id="adminModal" aria-hidden="true"><div class="modal-panel">
  <div class="modal-head"><h2>Panel EXPLORA</h2><button class="icon-close" data-close="adminModal">×</button></div>
  <div class="admin-tabs"><button class="action primary" id="adminPricesTab">Precios</button><button class="action secondary" id="adminBudgetsTab">Presupuestos</button></div>
  <div id="adminContent"></div>
</div></div>

<div class="toast" id="toast"></div>

function formatMoney(ars){const n=Number(ars||0);if(state.mode==='usd')return new Intl.NumberFormat('en-US',{style:'currency',currency:'USD',maximumFractionDigits:0}).format(n/Number(state.fx.usd||1200));if(state.mode==='brl')return new Intl.NumberFormat('pt-BR',{style:'currency',currency:'BRL',maximumFractionDigits:0}).format(n/Number(state.fx.brl||220));const total=state.mode==='card'?n*1.10:n;return new Intl.NumberFormat('es-AR',{style:'currency',currency:'ARS',maximumFractionDigits:0}).format(total).replace(',00','')}

function comboPrice(item){const o=state.prices[item.id]||{};return Number(o.comboRoundTrip||item.comboRoundTrip||20000)}

function buildGallery(){
  const gallery=$('gallery');gallery.innerHTML='';
  COUNTRY_ORDER.forEach(country=>{
    const section=document.createElement('section');section.className='country-section';section.dataset.country=country;
    const flag=country==='Argentina'?'🇦🇷':country==='Brasil'?'🇧🇷':'🇵🇾';
    section.innerHTML=`<div class="country-heading"><span class="country-flag">${flag}</span><h2>${t(country)}</h2></div><div class="cards-grid"></div>`;
    const grid=section.querySelector('.cards-grid');
    ATTRACTIONS.filter(x=>x.country===country).forEach(item=>grid.appendChild(createCard(item)));
    gallery.appendChild(section);
  });
  setupVideoObserver();
}
function createCard(item){
  const card=document.createElement('article');card.className='video-card';card.id=`card-${item.id}`;card.dataset.id=item.id;
  card.innerHTML=`<div class="media-stage" data-media="${item.id}"><video playsinline webkit-playsinline preload="none" poster="${item.poster}" data-src="${item.video}" data-start="${item.startAt||0}" disablepictureinpicture controlslist="nodownload nofullscreen noremoteplayback" aria-label="${itemName(item)}"></video><button class="play-button" data-play="${item.id}" aria-label="Reproducir ${itemName(item)}"></button>${item.restaurant?`<span class="free-badge">${t('free')}</span>`:''}<span class="selected-badge">${t('selected')}</span><div class="card-copy"><h3>${itemName(item)}</h3><p>${item.type} · ${item.duration}</p></div>${item.restaurant?`<div class="lock-layer"><div class="lock-content"><span class="lock-icon">🔒</span><span>${t('locked')}</span></div></div>`:''}</div><button class="select-button" data-action="${item.id}">${t('add')}</button>`;
  const video=card.querySelector('video');
  video.addEventListener('play',()=>card.classList.add('playing'));
  video.addEventListener('pause',()=>card.classList.remove('playing'));
  video.addEventListener('ended',()=>{card.classList.remove('playing');try{video.currentTime=Number(video.dataset.start||0)}catch{}});
  video.addEventListener('webkitbeginfullscreen',()=>{try{video.webkitExitFullscreen()}catch{}});
  return card;
}
let videoObserver;
function setupVideoObserver(){if(videoObserver)videoObserver.disconnect();videoObserver=new IntersectionObserver(entries=>entries.forEach(entry=>{const video=entry.target;if(entry.isIntersecting){ensureVideoSource(video)}else if(!video.paused){video.pause()}}),{rootMargin:'450px 0px'});document.querySelectorAll('.media-stage video').forEach(v=>videoObserver.observe(v))}
function ensureVideoSource(video){if(video.src)return;video.src=video.dataset.src;video.load();const seek=()=>{try{const at=Number(video.dataset.start||0);if(at>0&&Number.isFinite(video.duration)&&at<video.duration)video.currentTime=at}catch{}};video.addEventListener('loadedmetadata',seek,{once:true})}
function pauseAll(except=null){document.querySelectorAll('.media-stage video').forEach(v=>{if(v!==except&&!v.paused)v.pause()})}
async function toggleVideo(id){const item=getItem(id);const card=$(`card-${id}`);if(!item||!card)return;if(item.restaurant&&!hasBrazilExcursion()){showToast(t('needBrazil'));return}const video=card.querySelector('video');ensureVideoSource(video);if(!video.paused){video.pause();return}pauseAll(video);video.muted=false;video.volume=1;try{await video.play();state.activeVideo=video}catch{showToast(state.lang==='en'?'Tap again to play the video with sound.':'Tocá nuevamente para reproducir el video con sonido.') }}

function updateUI(){
  const brazil=hasBrazilExcursion();
  ATTRACTIONS.forEach(item=>{
    const card=$(`card-${item.id}`);if(!card)return;const selected=Boolean(state.cart[item.id]);const locked=Boolean(item.restaurant&&!brazil);
    card.classList.toggle('selected',selected);card.classList.toggle('locked',locked);
    const btn=card.querySelector('.select-button');btn.textContent=selected?t('remove'):t('add');btn.disabled=locked&&!selected;
    const badge=card.querySelector('.selected-badge');if(badge)badge.textContent=t('selected');
    const free=card.querySelector('.free-badge');if(free)free.textContent=t('free');
    const lock=card.querySelector('.lock-content span:last-child');if(lock)lock.textContent=t('locked');
  });

  $('dockCount').textContent=values.length===1?`1 ${t('item')}`:`${values.length} ${t('items')}`;$('dockTotal').textContent=formatMoney(totalArs());
  renderSelection();
}
function handleAction(id){const item=getItem(id);if(!item)return;if(state.cart[id]){removeItem(id);return}if(item.restaurant){if(!hasBrazilExcursion()){showToast(t('needBrazil'));return}selectRestaurant(item);return}if(item.oneWayOnly){addItem(item,t('oneway'),oneWayPrice(item));return}openChoices(item)}
function openChoices(item){state.pendingChoice=item.id;$('choiceTitle').textContent=itemName(item);$('choiceHint').textContent=t('chooseTripHint');const list=$('choiceList');const combo=item.comboEligible&&Boolean(state.cart[item.comboAfter]);if(combo){const price=comboPrice(item);list.innerHTML=choiceButton(t('extension'),price,'extension');}else{list.innerHTML=choiceButton(t('oneway'),oneWayPrice(item),'oneway')+choiceButton(t('roundtrip'),roundTripPrice(item),'roundtrip')}openModal('choiceModal')}

function addItem(item,kind,price){state.cart[item.id]={id:item.id,name:itemName(item),country:item.country,flag:item.flag,kind,price:Number(price),duration:item.duration,restaurant:Boolean(item.restaurant)};closeModal('choiceModal');updateUI();showToast(`${itemName(item)} · ${formatMoney(price)}`)}
function selectRestaurant(item){Object.keys(state.cart).forEach(id=>{const existing=getItem(id);if(existing&&existing.restaurant)delete state.cart[id]});state.cart[item.id]={id:item.id,name:itemName(item),country:item.country,flag:item.flag,kind:t('free'),price:0,duration:item.duration,restaurant:true};updateUI();showToast(`${itemName(item)} · ${t('free')}`)}
function removeItem(id){const wasBrazil=hasBrazilExcursion();delete state.cart[id];const nowBrazil=hasBrazilExcursion();let restaurantRemoved=false;if(wasBrazil&&!nowBrazil){Object.keys(state.cart).forEach(key=>{const item=getItem(key);if(item&&item.restaurant){delete state.cart[key];restaurantRemoved=true}})}updateUI();if(restaurantRemoved)showToast(t('restaurantRemoved'))}

function renderAdminPrices(){
  $('adminPricesTab').className='action primary';$('adminBudgetsTab').className='action secondary';
  const fx=`<div class="admin-grid"><strong>Cotización USD</strong><input inputmode="numeric" data-fx="usd" value="${state.fx.usd||1200}"></div><div class="admin-grid"><strong>Cotización BRL</strong><input inputmode="numeric" data-fx="brl" value="${state.fx.brl||220}"></div>`;
  const rows=ATTRACTIONS.filter(x=>!x.restaurant).map(item=>`<div class="admin-grid"><strong>${item.flag} ${item.name}</strong><input inputmode="numeric" data-price="${item.id}" value="${roundTripPrice(item)}"></div>`).join('');
  $('adminContent').innerHTML=fx+rows+`<button class="action primary" id="savePrices" style="width:100%;margin-top:14px">${t('savePrices')}</button>`;$('savePrices').onclick=savePrices;
}
function savePrices(){document.querySelectorAll('[data-fx]').forEach(input=>{const value=Number(input.value.replace(/\D/g,''));if(value>0)state.fx[input.dataset.fx]=value});document.querySelectorAll('[data-price]').forEach(input=>{const value=Number(input.value.replace(/\D/g,''));if(value>0){state.prices[input.dataset.price]={...(state.prices[input.dataset.price]||{}),baseRoundTrip:value}}});localStorage.setItem(LS_FX,JSON.stringify(state.fx));localStorage.setItem(LS_PRICES,JSON.stringify(state.prices));updateUI();showToast(t('priceSaved'))}
function renderAdminBudgets(){$('adminPricesTab').className='action secondary';$('adminBudgetsTab').className='action primary';$('adminContent').innerHTML=state.budgets.length?state.budgets.map(b=>`<div class="saved-budget"><strong>${b.name} · +${b.code} ${b.phone}</strong><small>${b.when} · ${formatMoney(b.total)}</small><small>${b.items.map(x=>x.name).join(' · ')}</small></div>`).join(''):`<p class="hint" style="text-align:center;padding:20px">${t('noBudgets')}</p>`}

$('loginContent').addEventListener('click',e=>{const lang=e.target.closest('[data-lang]');const mode=e.target.closest('[data-mode]');if(lang){state.lang=lang.dataset.lang;renderPayment();return}if(mode){state.mode=mode.dataset.mode;startApp()}});
$('gallery').addEventListener('click',e=>{const action=e.target.closest('[data-action]');if(action){handleAction(action.dataset.action);return}const play=e.target.closest('[data-play]');const media=e.target.closest('[data-media]');if(play||media)toggleVideo((play||media).dataset.play||(play||media).dataset.media)});
$('choiceList').addEventListener('click',e=>{const choice=e.target.closest('[data-choice]');if(!choice)return;const item=getItem(state.pendingChoice);if(item)addItem(item,t(choice.dataset.choice),Number(choice.dataset.price))});
$('selectionList').addEventListener('click',e=>{const remove=e.target.closest('[data-remove]');if(remove)removeItem(remove.dataset.remove)});
$('openSelection').onclick=()=>openModal('selectionModal');$('clearSelection').onclick=clearSelection;$('openPassenger').onclick=openPassenger;$('saveBudget').onclick=saveBudget;$('brandButton').onclick=registerOwnerTap;$('adminPricesTab').onclick=renderAdminPrices;$('adminBudgetsTab').onclick=renderAdminBudgets;
document.addEventListener('click',e=>{const close=e.target.closest('[data-close]');if(close)closeModal(close.dataset.close);if(e.target.classList.contains('modal'))closeModal(e.target.id)});
document.addEventListener('visibilitychange',()=>{if(document.hidden)pauseAll()});
window.addEventListener('pagehide',()=>pauseAll());
document.addEventListener('keydown',e=>{if(e.key==='Escape')document.querySelectorAll('.modal.open').forEach(m=>closeModal(m.id))});

renderLanguage();
if('serviceWorker'in navigator){window.addEventListener('load',async()=>{try{const reg=await navigator.serviceWorker.register('./service-worker.js',{scope:'./'});await navigator.serviceWorker.ready;const worker=reg.active||reg.waiting||reg.installing;if(worker)worker.postMessage({type:'CACHE_APP'})}catch{}})}
</script>
</body>
</html>
